<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maré Boa</title>
<style>
:root { --bg: #F1F5F7; --fg: #12283A; --soft: #4F6575; --brand: #0E5A7A; }
@media (prefers-color-scheme: dark) { :root { --bg: #071A28; --fg: #E3EDF2; --soft: #9DB3C1; --brand: #4CC3D6; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; }
main { max-width: 36rem; margin: 0 auto; padding: 64px 16px; }
h1 { font-size: 40px; margin: 0 0 8px; color: var(--brand); }
p { color: var(--soft); font-size: 18px; line-height: 1.5; }
a { color: var(--brand); }
</style>
</head>
<body>
<main>
  <h1>Maré Boa</h1>
  <p>App de pesca para a Grande Florianópolis: pontos de pesca, maré, clima e a comunidade de pescadores.</p>
  <p><a href="privacidade/">Política de privacidade</a> · Contato: mareboa.app@gmail.com</p>
</main>
</body>
</html>
